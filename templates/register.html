<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini SOC - Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-main);
            background-image: radial-gradient(circle at top right, rgba(16, 185, 129, 0.1), transparent 400px);
        }
        .login-box {
            background-color: var(--bg-card);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            width: 380px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header h2 {
            margin: 10px 0 5px 0;
            font-size: 1.5rem;
        }
        .login-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin: 0;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 20px;
        }
        .form-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            box-sizing: border-box;
            background-color: #1a1825;
            border: 1px solid var(--border-color);
            padding: 12px 15px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .form-group input:focus {
            border-color: var(--success);
            background-color: rgba(16, 185, 129, 0.05);
        }
        .btn-full {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            margin-top: 10px;
            background-color: var(--success);
        }
        .auth-link {
            text-align: center;
            margin-top: 25px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .auth-link a {
            color: var(--success);
            text-decoration: none;
            font-weight: 600;
        }
        .auth-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="login-header">
            <div style="font-size: 2.5rem; color: var(--success);">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <h2>Create Account</h2>
            <p>Register as a new SOC Analyst</p>
        </div>
        
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div style="background-color: rgba(245, 158, 11, 0.1); color: var(--warning); border: 1px solid var(--warning); padding: 10px; border-radius: 6px; margin-bottom: 20px; text-align: center; font-size: 0.9rem;">
                <i class="fa-solid fa-triangle-exclamation"></i> {{ messages[0] }}
            </div>
          {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label>Choose Username</label>
                <input type="text" name="username" placeholder="E.g. jdoe_sec" required>
            </div>
            <div class="form-group">
                <label>Choose Password</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-full">Register Account</button>
        </form>
        
        <div class="auth-link">
            Already have an account? <a href="{{ url_for('login') }}">Sign In</a>
        </div>
    </div>
</body>
</html>
