<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini SOC - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-main);
        }
        .login-box {
            background-color: var(--bg-card);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            width: 350px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }
        .login-box h2 {
            margin-top: 0;
            margin-bottom: 30px;
        }
        .login-box form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .login-box input {
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div style="font-size: 3rem; color: var(--accent-blue); margin-bottom: 10px;">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h2>Enterprise IAM</h2>
        
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div style="color: var(--danger); margin-bottom: 15px; font-size: 0.9rem;">
                {{ messages[0] }}
            </div>
          {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit" class="btn" style="margin-top: 10px;">Secure Login</button>
        </form>
        <p style="color: var(--text-muted); font-size: 0.8rem; margin-top: 20px;">Demo access: admin / admin123</p>
    </div>
</body>
</html>
